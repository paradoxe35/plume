[package]
name = "plume-native"
version = "0.1.0"
edition = "2021"
authors = ["Plume Team"]
description = "Rust FFI library for Plume system input functionality"
license = "MIT"

[lib]
name = "plume_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies for system input
# Use rustdesk-org/rdev fork for Linux Wayland support (grab uses evdev, works on X11 and Wayland)
# This fork is required for macOS compatibility and has Wayland fixes
rdev = { git = "https://github.com/rustdesk-org/rdev" }
arboard = { version = "3.6", features = ["wayland-data-control"] }  # Clipboard with Wayland support
enigo = { version = "0.6", features = ["wayland", "x11rb"] }  # Keyboard simulation with Wayland and X11 support


# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Utilities
once_cell = "1.20"
parking_lot = "0.12"

# FFI-specific
libc = "0.2"

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip debug symbols
# The JVM loads this library in-process, so a Rust panic must unwind to the
# catch_unwind guards around the hotkey callbacks rather than abort the whole app.
panic = "unwind"
