language = "C"
pragma_once = true
include_guard = "PLUME_FFI_H"
autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not modify manually. */"
include_version = true
namespace = "plume"
tab_width = 4

[export]
prefix = "plume_"
item_types = ["globals", "enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]
# Exclude platform-specific extern declarations that conflict with system headers
exclude = [
    "CFRelease", "CFTypeRef", "CFStringRef", "AXUIElementRef", "AXError",
    "AXUIElementCreateSystemWide", "AXUIElementCopyAttributeValue",
    "CFStringCreateWithCString", "CFStringGetCStringPtr",
    "CGEventCreateKeyboardEvent", "CGEventSetFlags", "CGEventPost",
    "CGEventSourceFlagsState"
]

[parse]
parse_deps = false
include = ["plume-native"]

[fn]
rename_args = "None"
must_use = "Error"

[defines]
"target_os = linux" = "PLUME_LINUX"
"target_os = macos" = "PLUME_MACOS"
"target_os = windows" = "PLUME_WINDOWS"
