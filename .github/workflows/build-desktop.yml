name: Build desktop

# Windows and macOS cannot be built on the development machine, so this workflow is where they are
# actually exercised. Each job builds the Rust library natively, runs the tests, and produces the
# installers for its own operating system — jpackage only ever targets the host it runs on.
on:
  push:
    branches: [feature/multiplatform]
  pull_request:
    branches: [feature/multiplatform]
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # One platform failing must not hide the others: the point of this workflow is finding out
    # which ones work.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    defaults:
      run:
        # Windows runners default to PowerShell, where `./gradlew` picks the extensionless shell
        # script and fails. One shell everywhere keeps the steps identical.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The wrapper fetches its own distribution from services.gradle.org on the first Gradle
      # invocation, and that download has no retry: a reset connection fails the whole job with a
      # stack trace from `org.gradle.wrapper.Install`, which looks like a build failure and is not
      # one. Fetching it here, with retries, keeps a transient network fault out of the build
      # steps — and once it is fetched, setup-gradle caches it for later runs.
      - name: Fetch the Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle bootstrap failed (attempt $attempt of 3), retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      # rdev and enigo build against X11 and libxdo; the rest is what jpackage shells out to.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxi-dev libxtst-dev libxkbcommon-dev pkg-config \
            rpm fakeroot binutils desktop-file-utils

      # jpackage shells out to WiX's candle.exe and light.exe, which exist only in WiX 3 — it does
      # not support WiX 4 or 5 (JDK-8319457). The binaries are pinned rather than taken from the
      # runner image, so a change to that image cannot break this silently.
      - name: Install WiX 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wix.zip" `
            -MaximumRetryCount 3 -RetryIntervalSec 10
          Expand-Archive -Path "$env:RUNNER_TEMP\wix.zip" -DestinationPath "$env:RUNNER_TEMP\wix3"
          "$env:RUNNER_TEMP\wix3" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check WiX is on the path
        if: runner.os == 'Windows'
        run: candle.exe -? | head -2

      - name: Build the native library
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Test the native library
        run: cargo test --release --manifest-path native/Cargo.toml

      # Covers the check that the library is packaged where JNA looks for it — the one thing that
      # differs per platform and that fails at runtime rather than at build time.
      - name: Test
        run: ./gradlew :shared:desktopTest :desktop:test --stacktrace

      # Both variants are built so they can be compared. `release` runs ProGuard over the app's
      # own jars and takes roughly a third off the download; it cannot touch the bundled JVM or
      # Skia, which are most of the size. Minification can only break things at runtime, so the
      # unminified build is kept as the known-good reference.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable --stacktrace
          ./gradlew :desktop:packageReleaseDeb :desktop:packageReleaseRpm \
            :desktop:createReleaseDistributable --stacktrace
          ./.github/scripts/build-appimage.sh \
            desktop/build/compose/binaries/main/app/Plume \
            desktop/build/appimage
          ARCH=x86_64 ./.github/scripts/build-appimage.sh \
            desktop/build/compose/binaries/main-release/app/Plume \
            desktop/build/appimage-release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          ./gradlew :desktop:packageMsi :desktop:packageExe --stacktrace
          ./gradlew :desktop:packageReleaseMsi :desktop:packageReleaseExe --stacktrace

      # Unsigned: enough to install and run locally after allowing it in Gatekeeper. Shipping to
      # other people needs a Developer ID and notarisation, which needs secrets this does not have.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./gradlew :desktop:packageDmg --stacktrace
          ./gradlew :desktop:packageReleaseDmg --stacktrace

      - name: List what was produced
        run: |
          find desktop/build/compose/binaries desktop/build/appimage* -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.AppImage' \) -exec ls -lh {} + || true

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: plume-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/appimage/*.AppImage
            desktop/build/compose/binaries/main-release/deb/*.deb
            desktop/build/compose/binaries/main-release/rpm/*.rpm
            desktop/build/compose/binaries/main-release/msi/*.msi
            desktop/build/compose/binaries/main-release/exe/*.exe
            desktop/build/compose/binaries/main-release/dmg/*.dmg
            desktop/build/appimage-release/*.AppImage

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.name }}
          path: |
            shared/build/reports/tests
            desktop/build/reports/tests
