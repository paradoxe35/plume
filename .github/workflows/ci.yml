name: CI

# Every pull request, on all three desktop operating systems plus Android. This builds and tests
# but never packages: installers take minutes and only matter for a release, whereas the thing that
# actually differs per platform — the native library, and whether it is packaged where JNA looks
# for it — is covered by the tests.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    defaults:
      run:
        # Windows runners default to PowerShell, where `./gradlew` picks the extensionless shell
        # script and fails.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # The wrapper's own download has no retry, and a reset connection fails the job with a stack
      # trace that reads like a build failure.
      - name: Fetch the Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle bootstrap failed (attempt $attempt of 3), retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      # rdev and enigo build against X11 and libxdo.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxi-dev libxtst-dev libxkbcommon-dev pkg-config

      - name: Test the native library
        run: cargo test --manifest-path native/Cargo.toml

      - name: Test the desktop
        run: ./gradlew :shared:desktopTest :desktop:test --stacktrace

      # Android only needs building once, and its unit tests run on the JVM.
      - name: Build and test Android
        if: runner.os == 'Linux'
        run: ./gradlew :shared:testDebugUnitTest :app:assembleDebug --stacktrace

  # The first time anything has type-checked iOS. The Kotlin/Native targets are gated behind a
  # macOS host, so on every other machine these eleven files are never compiled at all — a
  # `java.util.Locale` in shared code went unnoticed for exactly that reason.
  #
  # Not blocking yet: iOS has never been built, so this is expected to fail before it passes, and
  # a red iOS job should not hold up desktop and Android work. Drop `continue-on-error` once green.
  ios:
    name: iOS
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch the Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle bootstrap failed (attempt $attempt of 3), retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

      # Device and simulator both, since they are separate compilations and can fail apart.
      - name: Compile the shared framework
        run: |
          ./gradlew :shared:compileKotlinIosArm64 \
                    :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Link the framework the Xcode project expects
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Catches the Swift side: the keyboard extension, the entitlements wiring, and whether the
      # generated project still refers to files that exist. Unsigned, so it never needs an account.
      - name: Build the app and the keyboard extension
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen
          xcodebuild build \
            -project Plume.xcodeproj \
            -scheme Plume \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
